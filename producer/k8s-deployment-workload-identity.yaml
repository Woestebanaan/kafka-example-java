apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-example-java-producer
  labels:
    app: kafka-example-java-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-example-java-producer
  template:
    metadata:
      labels:
        app: kafka-example-java-producer
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: <your-service-account>
      containers:
        - name: kafka-producer
          image: ghcr.io/woestebanaan/kafka-example-java-producer:latest
          imagePullPolicy: Always
          env:
            - name: AZURE_CLIENT_ID
              value: "<your-azure-ad-client-id>"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-broker.example.com:9094"
            - name: KAFKA_TOPIC
              value: "my-topic"
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SASL_SSL"
            - name: KAFKA_SASL_MECHANISM
              value: "OAUTHBEARER"
            - name: KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM
              value: "https"
            - name: KAFKA_ENABLE_INSECURE_SSL
              value: "false"
            - name: KAFKA_SSL_CA_LOCATION
              value: "/app/certs/ca-kafka.pem"
          volumeMounts:
            - name: kafka-ca-cert
              mountPath: /app/certs
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: kafka-ca-cert
          secret:
            secretName: kafka-ca-cert
