apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-example-java
  labels:
    app: kafka-example-java
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-example-java
  template:
    metadata:
      labels:
        app: kafka-example-java
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: <your-service-account>
      containers:
        - name: kafka-consumer
          image: ghcr.io/woestebanaan/kafka-example-java:latest
          imagePullPolicy: Always
          env:
            - name: AZURE_CLIENT_ID
              value: "<your-azure-ad-client-id>"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-broker.example.com:9094"
            - name: KAFKA_GROUP_ID
              value: "my-consumer-group"
            - name: KAFKA_TOPIC
              value: "my-topic"
            - name: KAFKA_AUTO_OFFSET_RESET
              value: "earliest"
            - name: KAFKA_ENABLE_AUTO_COMMIT
              value: "true"
            - name: KAFKA_SECURITY_PROTOCOL
              value: "SASL_SSL"
            - name: KAFKA_SASL_MECHANISM
              value: "OAUTHBEARER"
            - name: KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM
              value: "https"
            - name: KAFKA_ENABLE_INSECURE_SSL
              value: "false"
            - name: KAFKA_SSL_CA_LOCATION
              value: "/app/certs/ca-kafka.pem"
          volumeMounts:
            - name: kafka-ca-cert
              mountPath: /app/certs
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: kafka-ca-cert
          secret:
            secretName: kafka-ca-cert
